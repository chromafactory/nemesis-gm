<title>Nemesis — Game Master</title>
<style>
  :root {
    --bg:        #08080f;
    --panel:     #0f0f1c;
    --header:    #0c0012;
    --accent:    #7a0000;
    --accent2:   #cc2200;
    --text:      #d8d0c0;
    --text-dim:  #706860;
    --text-hi:   #ffffff;
    --btn-bg:    #14102a;
    --btn-hov:   #22184a;
    --btn-bord:  #6a0000;
    --btn-hbord: #cc2200;
    --title-fg:  #ff5555;
    --nav-bg:    #0c0c18;
    --nav-bord:  #2a0820;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Courier New', Courier, monospace;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  /* ── header ── */
  header {
    background: var(--header);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 2px solid var(--accent);
    flex-shrink: 0;
  }
  header .brand {
    color: #cc4444;
    font-size: 0.8rem;
    letter-spacing: 2px;
    font-weight: bold;
  }
  header .nav-btns {
    display: flex;
    gap: 8px;
  }
  header button {
    background: transparent;
    border: 1px solid #3a1030;
    color: var(--text-dim);
    font-family: inherit;
    font-size: 0.7rem;
    padding: 5px 10px;
    border-radius: 3px;
    cursor: pointer;
    transition: all .15s;
  }
  header button:hover { color: var(--text-hi); border-color: var(--accent2); }

  /* ── main content area ── */
  main {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px 32px;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
  }

  /* ── screen title ── */
  #screen-title {
    color: var(--title-fg);
    font-size: clamp(1.3rem, 5vw, 1.9rem);
    font-weight: bold;
    white-space: pre-line;
    text-align: center;
    line-height: 1.2;
    margin-bottom: 14px;
    letter-spacing: 1px;
  }

  .divider {
    height: 2px;
    background: var(--accent);
    margin: 0 0 16px;
    border-radius: 1px;
  }

  /* ── body text ── */
  #screen-text {
    white-space: pre-line;
    font-size: clamp(0.78rem, 2.5vw, 0.92rem);
    line-height: 1.65;
    color: var(--text);
    margin-bottom: 22px;
  }

  /* ── option buttons ── */
  #options {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .opt-btn {
    display: block;
    width: 100%;
    text-align: left;
    padding: 12px 16px;
    font-family: inherit;
    font-size: clamp(0.75rem, 2.3vw, 0.88rem);
    font-weight: bold;
    background: var(--btn-bg);
    color: var(--text);
    border: 1px solid var(--btn-bord);
    border-radius: 4px;
    cursor: pointer;
    transition: background .12s, border-color .12s, color .12s;
    -webkit-tap-highlight-color: transparent;
  }
  .opt-btn:hover, .opt-btn:active {
    background: var(--btn-hov);
    border-color: var(--btn-hbord);
    color: var(--text-hi);
  }
  .opt-btn.nav {
    background: var(--nav-bg);
    color: var(--text-dim);
    border-color: var(--nav-bord);
    font-weight: normal;
  }
  .opt-btn.nav:hover, .opt-btn.nav:active {
    background: var(--btn-hov);
    color: var(--text-hi);
    border-color: #6a2040;
  }

  /* ── footer breadcrumb ── */
  footer {
    background: var(--header);
    padding: 8px 16px;
    font-size: 0.65rem;
    color: var(--text-dim);
    border-top: 1px solid #1a0818;
    flex-shrink: 0;
    letter-spacing: 1px;
  }

  /* ── scroll-to-top on navigation ── */
  html { scroll-behavior: smooth; }

  /* ── mobile: slightly larger tap targets ── */
  @media (max-width: 480px) {
    .opt-btn { padding: 14px 14px; }
    main { padding: 14px 12px 40px; }
  }

  /* ── warning / good colour helpers ── */
  .warn { color: #ff8800; }
</style>
</head>

// ── Navigation state ────────────────────────────────────────────────────────
let current  = "home";
let history  = [];

// ── Navigate to a screen ────────────────────────────────────────────────────
function goTo(id, addHistory = true) {
  if (!SCREENS[id]) id = "home";
  if (addHistory && id !== current) history.push(current);
  if (history.length > 40) history.shift();
  current = id;
  render();
  document.getElementById("main-content").scrollTop = 0;
  window.scrollTo(0, 0);
}

function goBack() {
  if (history.length) goTo(history.pop(), false);
  else goTo("home", false);
}

function goHome() { goTo("home"); }

// ── Render current screen ────────────────────────────────────────────────────
function render() {
  const s = SCREENS[current];
  if (!s) return;

  document.getElementById("screen-title").textContent = s.title;
  document.getElementById("screen-text").textContent  = s.text;
  document.getElementById("breadcrumb").textContent   = "/" + current;

  const container = document.getElementById("options");
  container.innerHTML = "";

  s.options.forEach(opt => {
    const isNav = opt.label === "HOME" || opt.label === "BACK" || opt.target === "home";
    const btn   = document.createElement("button");
    btn.className  = "opt-btn" + (isNav ? " nav" : "");
    btn.textContent = "  " + opt.label;
    btn.onclick     = () => goTo(opt.target);
    container.appendChild(btn);
  });
}

// ── Keyboard shortcuts ───────────────────────────────────────────────────────
document.addEventListener("keydown", e => {
  if (e.key === "Backspace" && e.target.tagName !== "INPUT") goBack();
  if (e.key === "Escape") goHome();
});

// ── Boot ─────────────────────────────────────────────────────────────────────
goTo("home", false);
</script>
